# This file defines Continuous Integration (CI) tests for BRL-CAD using the
# Github Actions framework.  Currently it defines configurations for Windows,
# Linux and OSX.  These tests are run on a fixed schedule, rather than per
# push, and will typically take longer to run.
#
# Tests here are intended to test more expensive integrations and longer
# builds than the ones targeted at per-commit feedback.  The tradeoff is
# that a failure in these tests might be cause by any commit within a
# 24 hour block of time, so the developer will need to track down the
# specifics themselves.

name: Scheduled

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch:

jobs:

  linux_bext:
    name: Linux - BRL-CAD bext build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Setup - CMake
        uses: lukka/get-cmake@latest

      # Install system dependencies
      - name: Install apt dependencies
        run: |
          sudo apt-get update
          # Install X/OpenGL dev pkgs
          sudo apt-get install xserver-xorg-dev libx11-dev libxi-dev libxext-dev libglu1-mesa-dev libfontconfig-dev
          # Install tools
          sudo apt-get install astyle re2c xsltproc libxml2-utils
          # Install dependency dev pkgs
          sudo apt-get install zlib1g-dev libpng-dev libjpeg-dev libtiff-dev libeigen3-dev libgdal-dev libassimp-dev libopencv-dev tcl-dev tk-dev
          # Install XCB/OpenGL dev pkgs for Qt - see:
          # https://wiki.qt.io/Building_Qt_6_from_Git
          # https://doc.qt.io/qt-6/linux-requirements.html
          sudo apt-get install libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-util-dev libxcb-xinerama0-dev libxcb-xkb-dev libxcb-xinput-dev libxcb-xrm-dev libxkbcommon-dev libxkbcommon-x11-dev
          sudo apt-get install libgl-dev
          sudo apt-get install libinput-dev

      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: brlcad

      - name: Directory setup
        run: |
          cmake -E make_directory build_linux
          cmake -E make_directory $HOME/.cache
          cmake -E make_directory $HOME/.cache/BRL-CAD

      - name: Configure
        run: |
          export PATH=$GITHUB_WORKSPACE:$PATH
          cmake -S brlcad -B build_linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DBRLCAD_EXT_PARALLEL=1 -DBRLCAD_BEXT_CLEANUP=ON -DBRLCAD_ENABLE_QT=ON

      - name: Build + Check + Package
        run: |
          export PATH=$GITHUB_WORKSPACE:$PATH
          cmake --build build_linux --config Release --target check
          cmake --build build_linux --config Release --target package

  windows_bext:
    name: MSVC - Ninja - BRL-CAD bext build
    needs: [linux_bext]
    runs-on: windows-latest
    strategy:
      fail-fast: true
    if: ${{ !cancelled() }}
    steps:
      - name: Setup - CMake
        uses: lukka/get-cmake@latest

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Add cl.exe to PATH
        uses: ilammy/msvc-dev-cmd@v1

      - name: Add github workspace to path
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value $env:GITHUB_WORKSPACE

      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: brlcad

      - name: Build Directory setup
        run: cmake -E make_directory ./build_winninja

      - name: Configure
        shell: powershell
        run: |
          cmake -S brlcad -B build_winninja -G Ninja -DCMAKE_C_COMPILER="cl.exe" -DCMAKE_CXX_COMPILER="cl.exe" -DCMAKE_BUILD_TYPE=Release -DBRLCAD_EXT_PARALLEL=1 -DBRLCAD_BEXT_CLEANUP=ON -DBRLCAD_ENABLE_QT=ON

      - name: Build
        shell: powershell
        run: |
          ninja -j1 -v
        working-directory: ${{ github.workspace }}/build_winninja

      - name: Check
        shell: powershell
        run: |
          ninja check -v
        working-directory: ${{ github.workspace }}/build_winninja

      - name: Package
        shell: powershell
        run: |
          ninja package
        working-directory: ${{ github.workspace }}/build_winninja

  windows_std_tools_bext:
    name: MSVC - Standard Tools - BRL-CAD bext build
    needs: [windows_bext]
    runs-on: windows-latest
    strategy:
      fail-fast: true
    if: ${{ !cancelled() }}
    steps:
      - name: Setup - CMake
        uses: lukka/get-cmake@latest

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Add cl.exe to PATH
        uses: ilammy/msvc-dev-cmd@v1

      - name: Add github workspace to path
        shell: cmd
        run: echo %GITHUB_WORKSPACE%>>"%GITHUB_PATH%"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: brlcad

      - name: Build Directory setup
        run: |
          cmake -E make_directory ./build_winstd

      - name: Configure
        shell: cmd
        run: |
          where cmake
          where ninja
          where cl.exe
          where msbuild
          cmake -S brlcad -B build_winstd -DBRLCAD_EXT_PARALLEL=1 -DBRLCAD_BUNDLED_LIBS=Bundled -DCMAKE_BUILD_TYPE=Release -DBRLCAD_BEXT_CLEANUP=ON -DBRLCAD_ENABLE_QT=ON

      - name: Build
        shell: cmd
        run: |
          cmake --build build_winstd --config Release --target mged

      - name: Check
        shell: cmd
        run: |
          cmake --build build_winstd --config Release --target check

      - name: Package
        shell: cmd
        run: |
          cmake --build build_winstd --config Release --target package

  osx_bext:
    name: macOS - BRL-CAD bext build
    needs: [linux_bext]
    runs-on: macos-14
    strategy:
      fail-fast: true
    if: ${{ !cancelled() }}
    steps:
      - name: Setup - CMake
        uses: lukka/get-cmake@latest

      - name: Install Xquartz
        run: |
          brew install xquartz --cask

      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: brlcad

      - name: Build Directory setup
        run: |
          cmake -E make_directory build_osx
          cmake -E make_directory $HOME/.cache
          cmake -E make_directory $HOME/.cache/BRL-CAD

      - name: Configure
        run: |
          export PATH=$GITHUB_WORKSPACE:$PATH
          export CC=clang
          export CXX=clang++
          cmake -S brlcad -B build_osx -DCMAKE_BUILD_TYPE=Release -DBRLCAD_EXT_PARALLEL=1 -DBRLCAD_BEXT_CLEANUP=ON -DBRLCAD_ENABLE_QT=ON

      - name: Build
        run: |
          make
        working-directory: ${{ github.workspace }}/build_osx

      - name: Check
        run: |
          make check
        working-directory: ${{ github.workspace }}/build_osx

      - name: Package
        run: |
          make package
        working-directory: ${{ github.workspace }}/build_osx

  linux_static:
    name: Clang Static Analyser
    needs: [linux_bext]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
    env:
      DEBIAN_FRONTEND: noninteractive
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    steps:
      - name: Setup - CMake
        uses: lukka/get-cmake@latest

     # Setup hint from https://github.com/darktable-org/rawspeed/blob/develop/.github/workflows/ci-static-analysis.yml
      - name: Clang Static Analyzer Setup
        run: |
          sudo apt-get update
          sudo apt-get install clang-18 clang-tools-18
          # Install X/OpenGL dev pkgs
          sudo apt-get install xserver-xorg-dev libx11-dev libxi-dev libxext-dev libglu1-mesa-dev libfontconfig-dev
          # Install tools
          sudo apt-get install astyle re2c xsltproc libxml2-utils
          # Install dependency dev pkgs
          sudo apt-get install zlib1g-dev libpng-dev libjpeg-dev libtiff-dev libeigen3-dev libgdal-dev libassimp-dev libopencv-dev tcl-dev tk-dev
          # Install XCB/OpenGL dev pkgs for Qt - see:
          # https://wiki.qt.io/Building_Qt_6_from_Git
          # https://doc.qt.io/qt-6/linux-requirements.html
          sudo apt-get install libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-util-dev libxcb-xinerama0-dev libxcb-xkb-dev libxcb-xinput-dev libxcb-xrm-dev libxkbcommon-dev libxkbcommon-x11-dev
          sudo apt-get install libgl-dev
          sudo apt-get install libinput-dev          # Cleanup

      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: brlcad

      - name: Prepare bext dependencies
        uses: ./brlcad/.github/actions/prepare-bext
        with:
          platform-channel: ubuntu-24.04-${{ runner.arch }}-release
          source-dir: ${{ github.workspace }}/brlcad
          output-dir: ${{ runner.temp }}/bext_output
          build-type: Release
          artifact-token: ${{ secrets.BEXT_ARTIFACT_TOKEN }}

      - name: Directory setup
        run: |
          cmake -E make_directory build_clangstatic
          cmake -E make_directory $HOME/.cache
          cmake -E make_directory $HOME/.cache/BRL-CAD
        working-directory: ${{ github.workspace }}/brlcad

      - name: Run Analyzer
        env:
          BRLCAD_EXT_DIR: ${{ runner.temp }}/bext_output
        run: |
          export PATH=$GITHUB_WORKSPACE:/usr/share/clang/scan-build-18/bin:/usr/share/clang/scan-build-18/libexec:$PATH
          cp $GITHUB_WORKSPACE/brlcad/misc/clang-static-analyzer-run.sh .
          ./clang-static-analyzer-run.sh
        working-directory: ${{ github.workspace }}/brlcad/build_clangstatic

      - name: Summary
        if: success() || failure()
        run: |
          sudo apt-get install html2text
          html2text scan-reports-all/*/index.html
        working-directory: ${{ github.workspace }}/brlcad/build_clangstatic

  linux_pgo:
    name: GCC Profile-Guided Optimization
    needs: [linux_bext]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: true
    env:
      DEBIAN_FRONTEND: noninteractive
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      PGO_PATH: ${{ github.workspace }}/pgo-profile
      PGO_BENCHMARK_TARGETS: >-
        rt pixcmp benchmark_cp BENCHMARK_PIX_cp PIX_LOG_cp
        bldg391.g m35.g moss.g sphflake.g star.g world.g
      PGO_TRAINING_TARGETS: >-
        havoc.g Generic_Twin.g NIST_MBE_PMI_2.g
      PGO_TRAINING_SIZE: "512"
      PGO_TRAINING_AZIMUTH: "35"
      PGO_TRAINING_ELEVATION: "25"
      PGO_BENCHMARK_TIMEFRAME: "8"
      PGO_BENCHMARK_MAXTIME: "60"
      PGO_BENCHMARK_AVERAGE: "3"
      PGO_BENCHMARK_DEVIATION: "3"
      PGO_MIN_SPEEDUP: "1.0"
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    steps:
      - name: Setup - CMake
        uses: lukka/get-cmake@latest

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          # Install X/OpenGL dev pkgs
          sudo apt-get install xserver-xorg-dev libx11-dev libxi-dev libxext-dev libglu1-mesa-dev libfontconfig-dev
          # Install tools
          sudo apt-get install astyle re2c xsltproc libxml2-utils
          # Install dependency dev pkgs
          sudo apt-get install zlib1g-dev libpng-dev libjpeg-dev libtiff-dev libeigen3-dev libgdal-dev libassimp-dev libopencv-dev tcl-dev tk-dev
          # Install XCB/OpenGL dev pkgs for a fallback bext build
          sudo apt-get install libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-util-dev libxcb-xinerama0-dev libxcb-xkb-dev libxcb-xinput-dev libxcb-xrm-dev libxkbcommon-dev libxkbcommon-x11-dev
          sudo apt-get install libgl-dev libinput-dev

      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: brlcad

      - name: Prepare bext dependencies
        uses: ./brlcad/.github/actions/prepare-bext
        with:
          platform-channel: ubuntu-24.04-${{ runner.arch }}-release
          source-dir: ${{ github.workspace }}/brlcad
          output-dir: ${{ runner.temp }}/bext_output
          build-type: Release
          artifact-token: ${{ secrets.BEXT_ARTIFACT_TOKEN }}

      - name: Directory setup
        run: |
          set -euo pipefail
          cmake -E make_directory $HOME/.cache/BRL-CAD
          if [[ -e "$PGO_PATH" ]]; then
            echo "::error::PGO profile path unexpectedly exists before the generation build"
            exit 1
          fi

      - name: Configure baseline build
        run: |
          cmake -S brlcad -B build_pgo_baseline -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=ON \
            -DBRLCAD_EXT_DIR=${{ runner.temp }}/bext_output \
            -DBRLCAD_ENABLE_QT=OFF \
            -DBRLCAD_ENABLE_STEP=ON \
            -DBRLCAD_ENABLE_STRICT=ON

      - name: Build baseline
        run: cmake --build build_pgo_baseline --target $PGO_BENCHMARK_TARGETS

      - name: Configure profile-generation build
        run: |
          cmake -S brlcad -B build_pgo -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=ON \
            -DBRLCAD_EXT_DIR=${{ runner.temp }}/bext_output \
            -DBRLCAD_ENABLE_QT=OFF \
            -DBRLCAD_ENABLE_STEP=ON \
            -DBRLCAD_ENABLE_STRICT=ON \
            -DBRLCAD_PGO=ON
          grep -q -- '-fprofile-generate=' build_pgo/compile_commands.json

      - name: Build profile-generation binaries
        run: cmake --build build_pgo --target $PGO_BENCHMARK_TARGETS $PGO_TRAINING_TARGETS

      - name: Generate profile data
        run: |
          cmake \
            -DPGO_MODE=TRAIN \
            -DPGO_BUILD_DIR="$GITHUB_WORKSPACE/build_pgo" \
            -DPGO_RESULTS_DIR="$GITHUB_WORKSPACE/pgo-training" \
            -DPGO_PROFILE_DIR="$PGO_PATH" \
            -DPGO_TIMEFRAME="$PGO_BENCHMARK_TIMEFRAME" \
            -DPGO_MAXTIME="$PGO_BENCHMARK_MAXTIME" \
            -DPGO_AVERAGE="$PGO_BENCHMARK_AVERAGE" \
            -DPGO_DEVIATION="$PGO_BENCHMARK_DEVIATION" \
            -DPGO_TRAINING_SIZE="$PGO_TRAINING_SIZE" \
            -DPGO_TRAINING_AZIMUTH="$PGO_TRAINING_AZIMUTH" \
            -DPGO_TRAINING_ELEVATION="$PGO_TRAINING_ELEVATION" \
            -P brlcad/misc/CMake/scripts/pgo_benchmark.cmake

      - name: Configure profile-use build
        run: |
          # GCC incorporates the build path into profile filenames, so both
          # compilation passes must use the same build directory.
          cmake -E rm -rf build_pgo
          cmake -S brlcad -B build_pgo -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=ON \
            -DBRLCAD_EXT_DIR=${{ runner.temp }}/bext_output \
            -DBRLCAD_ENABLE_QT=OFF \
            -DBRLCAD_ENABLE_STEP=ON \
            -DBRLCAD_ENABLE_STRICT=ON \
            -DBRLCAD_PGO=ON
          grep -q -- '-fprofile-use=' build_pgo/compile_commands.json

      - name: Build profile-guided binaries
        run: cmake --build build_pgo --target $PGO_BENCHMARK_TARGETS

      - name: Benchmark and compare profile-guided build
        run: |
          cmake \
            -DPGO_MODE=COMPARE \
            -DPGO_BASELINE_BUILD_DIR="$GITHUB_WORKSPACE/build_pgo_baseline" \
            -DPGO_OPTIMIZED_BUILD_DIR="$GITHUB_WORKSPACE/build_pgo" \
            -DPGO_RESULTS_DIR="$GITHUB_WORKSPACE/pgo-results" \
            -DPGO_TIMEFRAME="$PGO_BENCHMARK_TIMEFRAME" \
            -DPGO_MAXTIME="$PGO_BENCHMARK_MAXTIME" \
            -DPGO_AVERAGE="$PGO_BENCHMARK_AVERAGE" \
            -DPGO_DEVIATION="$PGO_BENCHMARK_DEVIATION" \
            -DPGO_MIN_SPEEDUP="$PGO_MIN_SPEEDUP" \
            -P brlcad/misc/CMake/scripts/pgo_benchmark.cmake

  windows_pgo:
    name: MSVC Profile-Guided Optimization
    needs: [windows_bext]
    runs-on: windows-2025
    timeout-minutes: 180
    strategy:
      fail-fast: true
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      PGO_BENCHMARK_TARGETS: >-
        rt pixcmp benchmark_cp BENCHMARK_PIX_cp PIX_LOG_cp
        bldg391.g m35.g moss.g sphflake.g star.g world.g
      PGO_TRAINING_TARGETS: >-
        havoc.g Generic_Twin.g NIST_MBE_PMI_2.g
      PGO_TRAINING_SIZE: "512"
      PGO_TRAINING_AZIMUTH: "35"
      PGO_TRAINING_ELEVATION: "25"
      PGO_BENCHMARK_TIMEFRAME: "8"
      PGO_BENCHMARK_MAXTIME: "60"
      PGO_BENCHMARK_AVERAGE: "3"
      PGO_BENCHMARK_DEVIATION: "3"
      PGO_MIN_SPEEDUP: "1.0"
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    steps:
      - name: Setup - CMake
        uses: lukka/get-cmake@latest

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Add cl.exe to PATH
        uses: ilammy/msvc-dev-cmd@v1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: brlcad

      - name: Prepare bext dependencies
        uses: ./brlcad/.github/actions/prepare-bext
        with:
          platform-channel: windows-2025-${{ runner.arch }}-release
          source-dir: ${{ github.workspace }}/brlcad
          output-dir: ${{ runner.temp }}/bext_output
          build-type: Release
          artifact-token: ${{ secrets.BEXT_ARTIFACT_TOKEN }}

      - name: Set up PGO paths
        shell: pwsh
        run: |
          # Short build roots keep STEP-generated paths below Windows MAX_PATH.
          $paths = @{
            PGO_PATH = Join-Path $env:RUNNER_TEMP 'pgo-d'
            PGO_BASELINE_BUILD_DIR = Join-Path $env:RUNNER_TEMP 'pgo-b'
            PGO_GENERATE_BUILD_DIR = Join-Path $env:RUNNER_TEMP 'pgo-g'
            PGO_OPTIMIZED_BUILD_DIR = Join-Path $env:RUNNER_TEMP 'pgo-u'
            PGO_TRAINING_RESULTS_DIR = Join-Path $env:RUNNER_TEMP 'pgo-t'
            PGO_RESULTS_DIR = Join-Path $env:RUNNER_TEMP 'pgo-r'
          }
          if (Test-Path -LiteralPath $paths.PGO_PATH) {
            throw "PGO profile path unexpectedly exists before the generation build: $($paths.PGO_PATH)"
          }
          foreach ($path in $paths.GetEnumerator()) {
            Add-Content -Path $env:GITHUB_ENV -Value "$($path.Key)=$($path.Value)"
          }

      - name: Configure baseline build
        shell: pwsh
        run: |
          cmake -S brlcad -B "$env:PGO_BASELINE_BUILD_DIR" -G Ninja `
            -DCMAKE_C_COMPILER=cl.exe `
            -DCMAKE_CXX_COMPILER=cl.exe `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON `
            "-DBRLCAD_EXT_DIR=${{ runner.temp }}/bext_output" `
            -DBRLCAD_ENABLE_QT=OFF `
            -DBRLCAD_ENABLE_STEP=ON `
            -DBRLCAD_ENABLE_STRICT=ON

      - name: Build baseline
        shell: pwsh
        run: |
          $targets = $env:PGO_BENCHMARK_TARGETS -split '\s+'
          $arguments = @('--build', $env:PGO_BASELINE_BUILD_DIR, '--target') + $targets
          cmake @arguments

      - name: Configure profile-generation build
        shell: pwsh
        run: |
          cmake -S brlcad -B "$env:PGO_GENERATE_BUILD_DIR" -G Ninja `
            -DCMAKE_C_COMPILER=cl.exe `
            -DCMAKE_CXX_COMPILER=cl.exe `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON `
            "-DBRLCAD_EXT_DIR=${{ runner.temp }}/bext_output" `
            -DBRLCAD_ENABLE_QT=OFF `
            -DBRLCAD_ENABLE_STEP=ON `
            -DBRLCAD_ENABLE_STRICT=ON `
            -DBRLCAD_PGO=ON
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Select-String -Path "$env:PGO_GENERATE_BUILD_DIR/build.ninja" -SimpleMatch '/GENPROFILE:PGD=' -Quiet)) {
            throw 'The profile-generation build does not contain /GENPROFILE.'
          }

      - name: Build profile-generation binaries
        shell: pwsh
        run: |
          $targets = ($env:PGO_BENCHMARK_TARGETS + ' ' + $env:PGO_TRAINING_TARGETS) -split '\s+'
          $arguments = @('--build', $env:PGO_GENERATE_BUILD_DIR, '--target') + $targets
          cmake @arguments

      - name: Generate profile data
        shell: pwsh
        run: |
          cmake `
            -DPGO_MODE=TRAIN `
            "-DPGO_BUILD_DIR=$env:PGO_GENERATE_BUILD_DIR" `
            "-DPGO_RESULTS_DIR=$env:PGO_TRAINING_RESULTS_DIR" `
            "-DPGO_PROFILE_DIR=$env:PGO_PATH" `
            "-DPGO_TIMEFRAME=$env:PGO_BENCHMARK_TIMEFRAME" `
            "-DPGO_MAXTIME=$env:PGO_BENCHMARK_MAXTIME" `
            "-DPGO_AVERAGE=$env:PGO_BENCHMARK_AVERAGE" `
            "-DPGO_DEVIATION=$env:PGO_BENCHMARK_DEVIATION" `
            "-DPGO_TRAINING_SIZE=$env:PGO_TRAINING_SIZE" `
            "-DPGO_TRAINING_AZIMUTH=$env:PGO_TRAINING_AZIMUTH" `
            "-DPGO_TRAINING_ELEVATION=$env:PGO_TRAINING_ELEVATION" `
            -P brlcad/misc/CMake/scripts/pgo_benchmark.cmake

      - name: Configure profile-use build
        shell: pwsh
        run: |
          cmake -S brlcad -B "$env:PGO_OPTIMIZED_BUILD_DIR" -G Ninja `
            -DCMAKE_C_COMPILER=cl.exe `
            -DCMAKE_CXX_COMPILER=cl.exe `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON `
            "-DBRLCAD_EXT_DIR=${{ runner.temp }}/bext_output" `
            -DBRLCAD_ENABLE_QT=OFF `
            -DBRLCAD_ENABLE_STEP=ON `
            -DBRLCAD_ENABLE_STRICT=ON `
            -DBRLCAD_PGO=ON
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Select-String -Path "$env:PGO_OPTIMIZED_BUILD_DIR/build.ninja" -SimpleMatch '/USEPROFILE:PGD=' -Quiet)) {
            throw 'The profile-use build does not contain /USEPROFILE.'
          }

      - name: Build profile-guided binaries
        shell: pwsh
        run: |
          $targets = $env:PGO_BENCHMARK_TARGETS -split '\s+'
          $arguments = @('--build', $env:PGO_OPTIMIZED_BUILD_DIR, '--target') + $targets
          cmake @arguments

      - name: Benchmark and compare profile-guided build
        shell: pwsh
        run: |
          cmake `
            -DPGO_MODE=COMPARE `
            "-DPGO_BASELINE_BUILD_DIR=$env:PGO_BASELINE_BUILD_DIR" `
            "-DPGO_OPTIMIZED_BUILD_DIR=$env:PGO_OPTIMIZED_BUILD_DIR" `
            "-DPGO_RESULTS_DIR=$env:PGO_RESULTS_DIR" `
            "-DPGO_TIMEFRAME=$env:PGO_BENCHMARK_TIMEFRAME" `
            "-DPGO_MAXTIME=$env:PGO_BENCHMARK_MAXTIME" `
            "-DPGO_AVERAGE=$env:PGO_BENCHMARK_AVERAGE" `
            "-DPGO_DEVIATION=$env:PGO_BENCHMARK_DEVIATION" `
            "-DPGO_MIN_SPEEDUP=$env:PGO_MIN_SPEEDUP" `
            -P brlcad/misc/CMake/scripts/pgo_benchmark.cmake


  # See https://app.codecov.io/gh/BRL-CAD/brlcad for analysis results
  linux_cov:
    name: LCOV Coverage testing
    needs: [linux_bext]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
    env:
      DEBIAN_FRONTEND: noninteractive
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    steps:
      - name: Setup - CMake
        uses: lukka/get-cmake@latest

      - name: Setup - System
        run: |
          sudo apt-get update
          # Get the lcov tool and its dependencies
          sudo apt-get install lcov gdb
          # Install X/OpenGL dev pkgs
          sudo apt-get install xserver-xorg-dev libx11-dev libxi-dev libxext-dev libglu1-mesa-dev libfontconfig-dev
          # Install tools
          sudo apt-get install astyle re2c xsltproc libxml2-utils
          # Install dependency dev pkgs
          sudo apt-get install zlib1g-dev libpng-dev libjpeg-dev libtiff-dev libeigen3-dev libgdal-dev libassimp-dev libopencv-dev tcl-dev tk-dev
          # Install XCB/OpenGL dev pkgs for Qt - see:
          # https://wiki.qt.io/Building_Qt_6_from_Git
          # https://doc.qt.io/qt-6/linux-requirements.html
          sudo apt-get install libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-util-dev libxcb-xinerama0-dev libxcb-xkb-dev libxcb-xinput-dev libxcb-xrm-dev libxkbcommon-dev libxkbcommon-x11-dev
          sudo apt-get install libgl-dev
          sudo apt-get install libinput-dev

      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: brlcad

      - name: Prepare bext dependencies
        uses: ./brlcad/.github/actions/prepare-bext
        with:
          platform-channel: ubuntu-24.04-${{ runner.arch }}-release
          source-dir: ${{ github.workspace }}/brlcad
          output-dir: ${{ runner.temp }}/bext_output
          build-type: Release
          artifact-token: ${{ secrets.BEXT_ARTIFACT_TOKEN }}

      - name: Directory setup
        run: |
          cmake -E make_directory build_lcov
          cmake -E make_directory $HOME/.cache
          cmake -E make_directory $HOME/.cache/BRL-CAD

      - name: Configure
        run: |
          export PATH=$GITHUB_WORKSPACE:$PATH
          cmake -S brlcad -B build_lcov -DBRLCAD_ENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug -DBRLCAD_EXT_DIR=${{ runner.temp }}/bext_output -DBRLCAD_ENABLE_QT=ON

      - name: Build
        id: build_parallel
        run: |
          export PATH=$GITHUB_WORKSPACE:$PATH
          cmake --build build_lcov -j2
        continue-on-error: true

      - name: Build (serial for diagnostics)
        if: steps.build_parallel.outcome == 'failure'
        run: |
          export PATH=$GITHUB_WORKSPACE:$PATH
          cmake --build build_lcov -j1

      - name: Run Tests
        id: coverage_tests
        run: |
          find . -name '*.gcda' -exec rm {} \;
          cmake --build . --target check
        working-directory: ${{ github.workspace }}/build_lcov

      - name: Diagnose failed annotation test
        if: failure() && steps.coverage_tests.outcome == 'failure'
        continue-on-error: true
        run: |
          set +e
          ctest -R '^rt_datum_annot_semantics$' -VV
          cat Testing/Temporary/LastTest.log
          if command -v gdb >/dev/null 2>&1; then
            gdb --quiet --batch \
              -ex 'set pagination off' \
              -ex run \
              -ex 'thread apply all bt full' \
              --args ./src/librt/tests/rt_datum_annot_semantics
          fi
        working-directory: ${{ github.workspace }}/build_lcov

      - name: Capture Coverage
        run: |
          lcov --capture --directory . --output-file coverage.info
          lcov -r coverage.info \*\/bext_output\/\* > coverage-2.info
          lcov -r coverage-2.info \/usr\/\* > coverage_cad.info
          rm coverage-*.info
          mv coverage_cad.info ..
        working-directory: ${{ github.workspace }}/build_lcov

      - name: Upload
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage_cad.info

